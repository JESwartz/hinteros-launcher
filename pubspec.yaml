name: hinteros_launcher
description: "HinterOS launcher: the controller-driven home UI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  markdown: ^7.3.0
  qr: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_schema: ^5.2.2

flutter:
  uses-material-design: true

  assets:
    # The time zone map (Natural Earth, public domain; tool/gen_time_zone_map.dart).
    - assets/maps/time_zones.bin
    # The browser demo's content (lib/web_main.dart, assets/demo/NOTICE):
    # free apps and games, placeholder art. Web only: not in the desktop build.
    - path: assets/demo/
      platforms: [web]
    - path: assets/demo/icons/
      platforms: [web]
    - path: assets/demo/art/
      platforms: [web]
    - path: assets/demo/catalog/
      platforms: [web]
    - path: assets/demo/catalog/readme/
      platforms: [web]

  fonts:
    # Atkinson Hyperlegible (OFL-1.1, licence in assets/fonts/OFL.txt).
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.otf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.otf
          weight: 700
