name: hinteros_launcher
description: "HinterOS launcher: the controller-driven home UI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_schema: ^5.2.2

flutter:
  uses-material-design: true

  assets:
    # The time zone map (Natural Earth, public domain; tool/gen_time_zone_map.dart).
    - assets/maps/time_zones.bin

  fonts:
    # Atkinson Hyperlegible (OFL-1.1, licence in assets/fonts/OFL.txt).
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.otf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.otf
          weight: 700
